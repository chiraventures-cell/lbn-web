<style>
/* ============================================================
   Lions Business Network — web app
   Navy + gold, sampled from the crest. Mirrors the Android build.
   ============================================================ */
:root{
  --blue:#142B52; --blue-dark:#0B1B33; --blue-light:#2B4C86;
  --gold:#C9A227; --gold-mid:#E3C868; --gold-soft:#FBF3DC; --gold-ink:#3A2A00; --gold-deep:#8A6100;
  --bg:#F5F7FB; --ink:#16203A; --muted:#6A7590; --line:#DCE3EF;
  --green:#1E8E5A; --green-soft:#E6F6EE; --red:#C0392B; --red-soft:#FDECEA;
  --blue-soft:#EAF1FC; --on-blue:#C9D8F2;
  --appbar:56px; --navbar:60px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.4;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  user-select:none; -webkit-user-select:none;
}
input,textarea,select{user-select:text;-webkit-user-select:text}
.sel,.sel *{user-select:text;-webkit-user-select:text}
button{font-family:inherit}
[hidden]{display:none!important}
::-webkit-scrollbar{width:0;height:0}

/* icons */
.mi{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;
  font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;
  white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;font-variation-settings:'opsz' 24;vertical-align:middle;flex:none}
.mi.s14{font-size:14px}.mi.s16{font-size:16px}.mi.s18{font-size:18px}.mi.s20{font-size:20px}
.mi.s28{font-size:28px}.mi.s46{font-size:46px}
.mi.fill{font-variation-settings:'FILL' 1}
body.nofont .mi{visibility:hidden;width:1em}

/* ============================ shell ============================ */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;z-index:900}
#splash img{width:132px;height:132px;object-fit:contain}
.wordmark{font-size:13px;font-weight:900;letter-spacing:1.6px;color:var(--blue);text-align:center}
.wordmark small{display:block;font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--gold);margin-top:4px}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite}
.spinner.sm{width:18px;height:18px;border-width:2.2px}
.spinner.white{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

.appbar{flex:none;z-index:60;background:var(--blue);color:#fff;
  padding-top:var(--safe-t);box-shadow:0 1px 0 rgba(0,0,0,.06)}
.appbar-in{height:var(--appbar);display:flex;align-items:center;gap:4px;padding:0 4px}
.appbar button{background:none;border:0;color:#fff;padding:10px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.appbar button:active{background:rgba(255,255,255,.14)}
.appbar-title{flex:1;min-width:0;padding-left:4px}
.appbar-title b{display:block;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-title span{display:block;font-size:11.5px;color:var(--on-blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page{padding:14px 14px 96px}

.navbar{flex:none;z-index:60;background:#fff;
  border-top:1px solid var(--line);box-shadow:0 -1px 8px rgba(20,43,82,.06);
  padding-bottom:var(--safe-b);display:flex}
.navbar button{flex:1;background:none;border:0;height:var(--navbar);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--muted);cursor:pointer;position:relative;padding:0 2px}
.navbar button .pill{width:52px;height:28px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;transition:background .15s;position:relative}
.navbar button.on{color:var(--blue)}
.navbar button.on .pill{background:var(--gold-soft)}
.navbar button small{font-size:10.5px;font-weight:600;white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis}
.navbadge{position:absolute;top:-2px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--gold);color:var(--gold-ink);font-size:10px;font-weight:800;display:flex;
  align-items:center;justify-content:center}

.fab{position:absolute;right:16px;bottom:calc(var(--navbar) + var(--safe-b) + 16px);z-index:55;
  background:var(--gold);color:var(--gold-ink);border:0;border-radius:16px;height:50px;padding:0 20px;
  display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 5px 14px rgba(201,162,39,.42)}
.fab:active{transform:scale(.96)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(11,27,51,.45);z-index:70;opacity:0;
  transition:opacity .2s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:86vw;background:#fff;z-index:80;
  transform:translateX(-102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;box-shadow:2px 0 18px rgba(11,27,51,.2)}
.drawer.on{transform:none}
.drawer-head{background:var(--blue);border-bottom:4px solid var(--gold);
  padding:calc(22px + var(--safe-t)) 18px 20px;color:#fff}
.drawer-head .who{display:flex;gap:12px;align-items:center}
.drawer-head b{display:block;font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-head span{display:block;font-size:12.5px;color:var(--on-blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-head .club{margin-top:14px;font-size:11.5px;color:var(--on-blue);letter-spacing:.4px}
.drawer-list{flex:1;overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
.drawer-list button{width:100%;background:none;border:0;display:flex;align-items:center;gap:14px;
  padding:11px 18px;font-size:14px;color:var(--ink);text-align:left;cursor:pointer}
.drawer-list button .mi{color:var(--muted);font-size:21px}
.drawer-list button.on{background:var(--gold-soft);font-weight:700;color:var(--blue)}
.drawer-list button.on .mi{color:var(--blue)}
.drawer-list button span.lbl{flex:1}
.drawer-list .grp{padding:14px 18px 6px;font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.drawer-badge{min-width:22px;padding:2px 8px;border-radius:20px;background:var(--gold);
  color:var(--gold-ink);font-size:11.5px;font-weight:800;text-align:center}
.drawer-foot{border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.drawer-foot button{width:100%;background:none;border:0;display:flex;align-items:center;gap:14px;
  padding:13px 18px;font-size:14px;font-weight:600;color:var(--red);cursor:pointer}
.drawer-foot .synced{text-align:center;font-size:11px;color:var(--muted);padding:0 0 10px}

/* ============================ blocks ============================ */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.card.pad{padding:14px}
.section{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.section>header{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 14px;
  background:linear-gradient(90deg,var(--gold-soft),#fff);
  border-left:4px solid var(--gold);border-bottom:1px solid var(--line)}
.section>header h3{margin:0;flex:1;font-size:14.5px;font-weight:700;color:var(--blue)}
.section>header .hint{font-size:12.5px;font-weight:700;color:var(--muted)}
.section>.body{padding:14px}
.section>.body.flush{padding:0}

.label{font-size:11px;font-weight:800;letter-spacing:1.1px;color:var(--muted);
  text-transform:uppercase;padding-left:3px}

.greet{background:var(--blue);border-radius:14px;border-bottom:3px solid var(--gold);
  padding:15px;display:flex;align-items:center;gap:13px;color:#fff}
.greet .t{font-size:11.5px;color:var(--on-blue)}
.greet b{display:block;font-size:16.5px;font-weight:800;margin:2px 0 3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet .r{font-size:12px;color:var(--on-blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet .col{min-width:0;flex:1}

.avatar{border-radius:50%;border:2px solid var(--gold);background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(min-width:620px){.tiles{grid-template-columns:1fr 1fr 1fr}}
.tile{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px 13px;
  text-align:left;width:100%;cursor:pointer;display:block}
.tile.urgent{border-color:var(--gold)}
.tile.span{grid-column:1/-1}
.tile .top{display:flex;align-items:center;gap:7px}
.tile .bar{width:3px;height:12px;background:var(--blue);flex:none}
.tile .cap{font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--muted);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{display:block;font-size:23px;font-weight:800;color:var(--blue);margin-top:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.banner{display:flex;gap:11px;padding:13px;border-radius:12px;align-items:flex-start;margin-bottom:12px}
.banner.warn{background:var(--gold-soft);border:1px solid var(--gold-mid);color:var(--gold-deep)}
.banner.bad{background:var(--red-soft);border:1px solid var(--red);color:var(--red)}
.banner b{display:block;font-size:13.5px;font-weight:800}
.banner p{margin:2px 0 0;font-size:12px;line-height:1.35;color:var(--ink)}
.banner .act{background:none;border:0;color:var(--blue-light);font-weight:700;font-size:13px;
  padding:6px 8px;cursor:pointer;flex:none}
.offline-bar{background:var(--gold-soft);color:var(--gold-deep);font-size:12.5px;font-weight:600;
  padding:9px 14px;display:flex;gap:9px;align-items:center}

.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;
  font-size:11px;font-weight:700;white-space:nowrap}
.tag.green{background:var(--green-soft);color:var(--green);border:1px solid rgba(30,142,90,.35)}
.tag.red{background:var(--red-soft);color:var(--red);border:1px solid rgba(192,57,43,.35)}
.tag.blue{background:#E8EEF9;color:var(--blue);border:1px solid rgba(20,43,82,.3)}
.tag.gold{background:var(--gold-soft);color:var(--gold-deep);border:1px solid rgba(201,162,39,.5)}
.tag.grey{background:#EEF2F8;color:var(--muted);border:1px solid var(--line)}
.role{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;
  background:var(--gold);color:var(--gold-ink);font-size:10px;font-weight:800;white-space:nowrap}

.empty{padding:40px 24px;text-align:center}
.empty .mi{color:var(--line)}
.empty b{display:block;margin-top:12px;font-size:15px;font-weight:700;color:var(--blue)}
.empty p{margin:6px 0 0;font-size:13px;color:var(--muted)}

.row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row .col{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sb{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datechip{width:44px;padding:5px 0;border-radius:9px;background:var(--blue);color:#fff;text-align:center;flex:none}
.datechip b{display:block;font-size:15px;font-weight:800;line-height:1}
.datechip span{font-size:9px;color:var(--on-blue)}
.datechip.today{background:var(--gold);color:var(--gold-ink)}
.datechip.today span{color:var(--gold-ink)}

.quote{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:10px;
  padding:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap}
.quote .cap{font-size:11px;font-weight:800;color:var(--gold-deep);margin-bottom:4px;text-transform:none}
.moneybar{background:var(--green-soft);border-radius:9px;padding:7px 11px;display:flex;gap:7px;
  align-items:center;font-size:12.5px;font-weight:700;color:var(--green)}

.detail{display:flex;gap:10px;padding:6px 0;align-items:flex-start}
.detail .k{width:118px;flex:none;font-size:12.5px;font-weight:700;color:var(--muted)}
.detail .v{flex:1;font-size:13.5px;word-break:break-word}
.hr{height:1px;background:var(--line);margin:12px 0;border:0}

/* tabs */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabs button{flex:1;min-width:0;background:none;border:0;border-bottom:3px solid transparent;
  padding:13px 2px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;
  align-items:center;justify-content:center;gap:4px;white-space:nowrap;overflow:hidden}
.tabs button.on{color:var(--blue);border-bottom-color:var(--gold)}
.tabpill{padding:1px 7px;border-radius:20px;background:var(--gold);color:var(--gold-ink);
  font-size:11px;font-weight:800}
.tabpill.green{background:var(--green-soft);color:var(--green)}

/* filters */
.filters{background:#fff;padding:12px 14px;border-bottom:1px solid var(--line)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-top:10px;-webkit-overflow-scrolling:touch}
.chip{padding:8px 13px;border-radius:20px;border:1.4px solid var(--line);background:#fff;
  font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;
  display:flex;align-items:center;gap:4px;flex:none}
.chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep)}
.countbar{padding:8px 16px;font-size:12px;color:var(--muted)}

/* ============================ forms ============================ */
.field{margin-bottom:14px;position:relative}
.field>label{display:block;font-size:12.5px;font-weight:600;color:var(--blue);margin-bottom:6px}
.inp{width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;
  border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;outline:none;
  -webkit-appearance:none;appearance:none;min-height:50px}
.inp:focus{border-color:var(--gold);border-width:2px;padding:12px 13px}
.inp::placeholder{color:var(--muted)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.45}
select.inp{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='%236A7590'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:38px}
.inp.withicon{padding-left:44px}
.inp.withicon:focus{padding-left:43px}
.field .lead{position:absolute;left:14px;top:38px;color:var(--muted);pointer-events:none}
.field.noLabel .lead{top:14px}
.help{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35}
.help.ok{color:var(--green)}
.help.bad{color:var(--red)}
.pwtoggle{position:absolute;right:6px;top:32px;background:none;border:0;color:var(--blue-light);
  font-size:12.5px;font-weight:600;padding:10px;cursor:pointer}

.btn{width:100%;min-height:50px;border:0;border-radius:10px;background:var(--blue);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;padding:0 16px}
.btn:active{opacity:.86}
.btn[disabled]{opacity:.6;pointer-events:none}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);min-height:46px;font-size:14px}
.btn.ghost.green{color:var(--green);border-color:var(--green);background:#fff}
.btn.ghost.red{color:var(--red);border-color:var(--red);background:#fff}
.btn.sm{min-height:40px;font-size:13px;border-radius:9px}
.btn.link{background:none;color:var(--blue-light);font-weight:700;min-height:auto;
  padding:9px 8px;width:auto;font-size:13px}
.btnrow{display:flex;gap:10px}
.btnrow>*{flex:1}

.radio{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.radio .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;
  margin-top:1px;display:flex;align-items:center;justify-content:center}
.radio.on .dot{border-color:var(--accent,var(--blue))}
.radio.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent,var(--blue))}
.radio b{font-size:14px;font-weight:600;display:block}
.radio span{font-size:12px;color:var(--muted)}

/* member picker */
.picker{position:relative}
.picker .list{margin-top:6px;max-height:240px;overflow-y:auto;background:#fff;
  border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.picker .list button{width:100%;display:flex;gap:10px;align-items:center;padding:9px 12px;
  background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.picker .list button:last-child{border-bottom:0}
.picker .chosen{margin-top:8px;background:var(--green-soft);border:1px solid rgba(30,142,90,.35);
  border-radius:11px;padding:10px;display:flex;gap:10px;align-items:center}

/* sheets, dialogs, toast */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:none}
.sheet-wrap.on{display:block}
.sheet-scrim{position:absolute;inset:0;background:rgba(11,27,51,.45);opacity:0;transition:opacity .2s}
.sheet-wrap.in .sheet-scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;background:#fff;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  padding-bottom:var(--safe-b)}
.sheet-wrap.in .sheet{transform:none}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 0;flex:none}
.sheet .head{display:flex;align-items:center;gap:10px;padding:14px 8px 10px 18px;
  border-bottom:1px solid var(--line);flex:none}
.sheet .head .bar{width:4px;height:20px;background:var(--gold);flex:none}
.sheet .head h3{flex:1;margin:0;font-size:16.5px;font-weight:800;color:var(--blue);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .head button{background:none;border:0;padding:10px;color:var(--muted);cursor:pointer}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 28px;overscroll-behavior:contain}
.sheet.menu .body{padding:8px 0 14px}
.menuitem{width:100%;display:flex;gap:14px;align-items:center;padding:13px 18px;background:none;
  border:0;text-align:left;cursor:pointer}
.menuitem .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex:none;color:#fff}
.menuitem b{display:block;font-size:15px;font-weight:700}
.menuitem span{display:block;font-size:12.5px;color:var(--muted)}
.menuitem.plain{padding:14px 18px;font-size:14.5px}
.menuitem.plain .mi{color:var(--blue)}

.dlg-wrap{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:24px}
.dlg-wrap.on{display:flex}
.dlg-wrap .sc{position:absolute;inset:0;background:rgba(11,27,51,.45)}
.dlg{position:relative;background:#fff;border-radius:14px;padding:20px;max-width:400px;width:100%;
  box-shadow:0 12px 40px rgba(11,27,51,.3)}
.dlg h3{margin:0 0 10px;font-size:17px;font-weight:800;color:var(--blue)}
.dlg p{margin:0;font-size:14px;line-height:1.45}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.dlg .acts button{min-height:42px;padding:0 18px;border-radius:9px;border:0;font-size:14px;
  font-weight:700;cursor:pointer}
.dlg .acts .cancel{background:none;color:var(--blue-light)}
.dlg .acts .ok{background:var(--blue);color:#fff}
.dlg .acts .ok.danger{background:var(--red)}

#toast{position:fixed;left:14px;right:14px;bottom:calc(var(--navbar) + var(--safe-b) + 14px);z-index:200;
  display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--blue);color:#fff;border-radius:10px;padding:12px 14px;display:flex;gap:10px;
  align-items:center;font-size:13.5px;box-shadow:0 6px 20px rgba(11,27,51,.35);
  animation:rise .2s ease-out}
.toast.good{background:var(--green)}.toast.bad{background:var(--red)}
@keyframes rise{from{transform:translateY(14px);opacity:0}}

.photo{width:100%;height:170px;object-fit:cover;display:block;background:var(--line)}
.thumb{width:100%;height:160px;object-fit:cover;border-radius:10px;display:block}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:120;display:none;
  align-items:center;justify-content:center;padding:14px}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

/* login */
#login{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);
  padding:calc(34px + var(--safe-t)) 20px calc(30px + var(--safe-b))}
.login-in{max-width:460px;margin:0 auto;text-align:center}
.login-in img.crest{width:132px;height:132px;object-fit:contain}
.login-in h1{margin:22px 0 5px;font-size:23px;font-weight:800;color:var(--blue)}
.login-in .tagline{font-size:13px;color:var(--muted);margin-bottom:22px}
.login-in .field,.login-in .btn,.login-in .help{text-align:left}
.suggest{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:30;background:#fff;
  border-radius:12px;box-shadow:0 8px 26px rgba(11,27,51,.22);max-height:260px;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.suggest button{width:100%;display:flex;gap:10px;align-items:center;padding:11px 13px;background:none;
  border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.suggest button:last-child{border-bottom:0}
.suggest .nm{font-size:14px;font-weight:600}
.suggest .cp{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divider{height:1px;background:var(--line);margin:14px 0}
.centre{text-align:center}
.installtip{background:var(--gold-soft);border:1px solid var(--gold-mid);border-radius:12px;
  padding:12px;font-size:12.5px;color:var(--gold-deep);line-height:1.45;text-align:left;
  display:flex;gap:9px;align-items:flex-start;margin-top:16px}

/* register / visitor */
.authhead{display:flex;align-items:center;gap:8px;margin:0 0 14px;text-align:left}
.authhead button{background:none;border:0;color:var(--blue);cursor:pointer;display:flex;
  align-items:center;padding:4px;margin-left:-4px}
.authhead h2{margin:0;font-size:19px;font-weight:800;color:var(--blue)}
.fieldlabel{text-align:left;font-size:12.5px;font-weight:600;color:var(--blue);margin-bottom:6px}
.tickbox{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px;text-align:left;margin-bottom:16px}
.tickbox.on{background:var(--gold-soft);border-color:var(--gold-mid)}
.tickbox input{width:18px;height:18px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--blue);cursor:pointer}
.tickbox .tx{font-size:13px;line-height:1.45;flex:1;min-width:0}
.tickbox .tx b{display:block;font-size:13.5px;font-weight:700}
.tickbox .tx a{color:var(--blue);font-weight:700}

@media(min-width:760px){
  .page{max-width:720px;margin:0 auto}
  .sheet{left:50%;transform:translate(-50%,100%);width:560px;max-width:100%;border-radius:18px 18px 0 0}
  .sheet-wrap.in .sheet{transform:translate(-50%,0)}
  #toast{left:auto;right:20px;width:380px}
}
</style>
</head>

/* dates — display dd/MM/yyyy, store yyyy-MM-dd */
const Dates = {
  todayIso(){ return Dates.toIso(new Date()); },
  toIso(d){
    const p = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  },
  parse(iso){
    if(!iso) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
    if(m) return new Date(+m[1], +m[2]-1, +m[3]);
    const d = new Date(iso);
    return isNaN(d) ? null : d;
  },
  display(iso){
    const d = Dates.parse(iso);
    if(!d) return '—';
    const p = n => String(n).padStart(2,'0');
    return p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear();
  },
  /** days until the next day/month, ignoring the year */
  nextOccurrence(iso){
    const src = Dates.parse(iso);
    if(!src) return null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let next = new Date(today.getFullYear(), src.getMonth(), src.getDate());
    if(next < today) next = new Date(today.getFullYear()+1, src.getMonth(), src.getDate());
    return { date: next, days: Math.round((next - today) / 86400000) };
  },
  relative(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d)) return '';
    const mins = Math.floor((Date.now() - d.getTime()) / 60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs/24);
    if(days < 7) return days + 'd ago';
    return Dates.display(iso);
  },
  periodStart(p){
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if(p === 'week'){ const wd = (today.getDay() + 6) % 7; return new Date(today.getFullYear(), today.getMonth(), today.getDate() - wd); }
    if(p === 'month') return new Date(today.getFullYear(), today.getMonth(), 1);
    if(p === 'sixMonths') return new Date(today.getFullYear(), today.getMonth()-6, today.getDate());
    if(p === 'year') return new Date(today.getFullYear(), 0, 1);
    return null;
  },
  inPeriod(iso, p){
    if(p === 'all') return true;
    const start = Dates.periodStart(p), d = Dates.parse(iso);
    if(!start || !d) return false;
    return d >= start;
  }
};

/* money — Indian grouping */
const Money = {
  format(v){
    const n = Math.round(NUM_(v));
    try { return '₹' + n.toLocaleString('en-IN', {maximumFractionDigits:0}); }
    catch(_) { return '₹' + n; }
  },
  compact(v){
    const n = NUM_(v), sign = n < 0 ? '-' : '', a = Math.abs(n);
    if(a >= 10000000) return sign + '₹' + (a/10000000).toFixed(2) + 'Cr';
    if(a >= 100000)   return sign + '₹' + (a/100000).toFixed(2) + 'L';
    if(a >= 1000)     return sign + '₹' + (a/1000).toFixed(1) + 'K';
    return sign + '₹' + a.toFixed(0);
  }
};

/* tap to call / WhatsApp / email */
const Contacting = {
  digits(phone){
    let p = String(phone||'').replace(/[^0-9]/g,'');
    if(p.length === 10) p = '91' + p;      // assume India when no country code
    return p;
  },
  call(phone){ if(phone) location.href = 'tel:' + String(phone).replace(/[^0-9+]/g,''); },
  whatsapp(phone, message){
    if(!phone) return;
    const t = message ? '?text=' + encodeURIComponent(message) : '';
    window.open('https://wa.me/' + Contacting.digits(phone) + t, '_blank');
  },
  email(a){ if(a) location.href = 'mailto:' + a; }
};

/* toast */
function toast(msg, kind){
  const box = $('#toast');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  const icon = kind === 'good' ? 'check_circle' : kind === 'bad' ? 'error' : 'info';
  el.innerHTML = '<span class="mi s20">'+icon+'</span><span>'+esc(msg)+'</span>';
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s';
    setTimeout(() => el.remove(), 260); }, 3800);
}
const ok  = m => toast(m, 'good');
const bad = m => toast(m, 'bad');

/* confirm dialog */
function confirmDlg(title, message, confirmLabel, destructive){
  return new Promise(resolve => {
    $('#dlgTitle').textContent = title;
    $('#dlgMsg').textContent = message;
    const btn = $('#dlgOk');
    btn.textContent = confirmLabel || 'Confirm';
    btn.className = 'ok' + (destructive ? ' danger' : '');
    const wrap = $('#dlgWrap');
    const done = v => {
      wrap.classList.remove('on');
      btn.removeEventListener('click', onOk);
      wrap.removeEventListener('click', onCancel);
      resolve(v);
    };
    const onOk = () => done(true);
    const onCancel = e => { if(e.target.dataset.dlgCancel) done(false); };
    btn.addEventListener('click', onOk);
    wrap.addEventListener('click', onCancel);
    wrap.classList.add('on');
  });
}

/* a one-button notice — same dialog, cancel hidden */
function infoDlg(title, message, label){
  const c = $('#dlgWrap .cancel');
  c.hidden = true;
  return confirmDlg(title, message, label || 'Done', false)
    .then(v => { c.hidden = false; return v; });
}

/* bottom sheet */
let sheetOnClose = null;
let sheetBodyHandler = null;
function openSheet(title, html, opts){
  const wrap = $('#sheetWrap');
  detachSheetHandler();
  $('#sheetTitle').textContent = title || '';
  $('#sheetHead').hidden = !title;
  $('#sheet').classList.toggle('menu', !!(opts && opts.menu));
  $('#sheetBody').innerHTML = html;
  $('#sheetBody').scrollTop = 0;
  wrap.classList.add('on');
  requestAnimationFrame(() => wrap.classList.add('in'));
  sheetOnClose = (opts && opts.onClose) || null;
}
function detachSheetHandler(){
  if(sheetBodyHandler){ $('#sheetBody').removeEventListener('click', sheetBodyHandler); sheetBodyHandler = null; }
}
function closeSheet(){
  const wrap = $('#sheetWrap');
  detachSheetHandler();
  if(!wrap.classList.contains('on')) return;
  wrap.classList.remove('in');
  setTimeout(() => { wrap.classList.remove('on'); $('#sheetBody').innerHTML = ''; }, 250);
  if(sheetOnClose){ const f = sheetOnClose; sheetOnClose = null; f(); }
}
function sheetOpen(){ return $('#sheetWrap').classList.contains('on'); }

function showImage(src){
  $('#lightboxImg').src = src;
  $('#lightbox').classList.add('on');
}

      '<span class="lbl" style="flex:1">'+esc(lab)+'</span>'+
      (current === val ? '<span class="mi" style="color:var(--gold)">check</span>' : '')+'</button>');
  });
  openSheet(title, rows.join(''), {menu:true});
  sheetBodyHandler = e => {
    const b = e.target.closest('[data-pick]');
    if(!b) return;

/* photo capture — camera on mobile, file picker on desktop */
function pickPhoto(capture, maxPx, quality){
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    if(capture) inp.setAttribute('capture', 'environment');
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', () => {
      const file = inp.files && inp.files[0];
      inp.remove();
      if(!file){ resolve(null); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = maxPx || 1000;
          let w = img.width, h = img.height;
          if(w > max || h > max){ const r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality || 0.75));
        };
        img.onerror = () => { bad('Could not read that photo.'); resolve(null); };
        img.src = reader.result;
      };
      reader.onerror = () => { bad('Could not read that photo.'); resolve(null); };
      reader.readAsDataURL(file);
    });
    inp.click();
  });
}

/* terms — Jan–Jun = H1, Jul–Dec = H2, matching the database */
function currentTerm(on){
  const d = on || new Date();
  return d.getFullYear() + '-H' + (d.getMonth() <= 5 ? 1 : 2);
}
function termOfIso(iso){
  const d = Dates.parse(iso);
  if(!d) return '';
  return d.getFullYear() + '-H' + (d.getMonth() <= 5 ? 1 : 2);
}
function termLabelOf(t){
  if(!t || t.length < 7) return t || '';
  const y = t.slice(0,4);
  return t.endsWith('1') ? 'Jan–Jun ' + y : 'Jul–Dec ' + y;
}
function allTerms(){
  const set = new Set([currentTerm()]);
  S.referrals.forEach(r => { const t = termOfIso(r.createdAt); if(t) set.add(t); });
  S.meetings.forEach(m => { const t = termOfIso(m.meetingDate); if(t) set.add(t); });
  S.thankYouNotes.forEach(n => { const t = termOfIso(n.businessDate); if(t) set.add(t); });
  return Array.from(set).sort().reverse();
}

/* derived figures — identical rules to the Android build */
function statsFor(memberId, term){
  const inTerm = iso => !term || termOfIso(iso) === term;
  const given    = S.referrals.filter(r => r.fromMemberId === memberId && inTerm(r.createdAt));
  const received = S.referrals.filter(r => r.toMemberId === memberId && inTerm(r.createdAt));
  const sumConverted = list => list.filter(r => r.status === 'converted')
    .reduce((t,r) => t + r.convertedValue, 0);
  const tyGiven = S.thankYouNotes.filter(t => t.fromMemberId === memberId && inTerm(t.businessDate));
  const tyTaken = S.thankYouNotes.filter(t => t.toMemberId === memberId && inTerm(t.businessDate));
  const sumNotes = list => list.reduce((t,n) => t + n.amount, 0);
  return {
    given: given.length, received: received.length,
    pendingGiven: given.filter(r => r.status === 'pending').length,
    pendingReceived: received.filter(r => r.status === 'pending').length,
    convertedAsGiver: given.filter(r => r.status === 'converted').length,
    convertedAsReceiver: received.filter(r => r.status === 'converted').length,
    businessGiven: sumConverted(given) + sumNotes(tyGiven),
    businessTaken: sumConverted(received) + sumNotes(tyTaken),
    l2lCount: S.meetings.filter(m => l2lInvolves(m, memberId) && inTerm(m.meetingDate)).length,
    thankYouGiven: tyGiven.length, thankYouReceived: tyTaken.length
  };
}

function attendanceFor(memberId, term){
  const t = term || currentTerm();
  const rows = S.attendance.filter(a => a.memberId === memberId && a.term === t)
    .sort((a,b) => a.meetingDate.localeCompare(b.meetingDate));
  if(!rows.length) return {recorded:0,present:0,approvedLeave:0,absent:0,
    consecutiveAbsences:0,percentage:0,perfect:false,leavesRemaining:6,feeDue:false,atRisk:false};
  const present = rows.filter(a => a.status === 'present').length;
  const leave   = rows.filter(a => a.status === 'leave_approved').length;
  const absent  = rows.filter(a => a.status === 'absent').length;
  const all = S.attendance.filter(a => a.memberId === memberId)
    .sort((a,b) => b.meetingDate.localeCompare(a.meetingDate));
  let run = 0;
  for(const a of all){ if(a.status === 'absent') run++; else break; }
  const feeDue = run >= 3 || absent >= 6;
  return {
    recorded: rows.length, present, approvedLeave: leave, absent,
    consecutiveAbsences: run, percentage: rows.length ? (present+leave)*100/rows.length : 0,
    perfect: rows.length > 0 && absent === 0,
    leavesRemaining: Math.max(0, Math.min(6, 6 - absent)),
    feeDue, atRisk: !feeDue && (run === 2 || absent === 5)
  };
}

function upcomingCelebrations(within){
  const w = within || 30, out = [];
  activeMembers().forEach(m => {
    [[m.birthday, true], [m.anniversary, false]].forEach(pair => {

      if(!next || next.days > w) return;
      out.push({member:m, date:next.date, days:next.days, birthday:pair[1]});
    });
  });
  return out.sort((a,b) => a.days - b.days);
}

  const m = res || {};
  if(m.ok !== true) throw new AppError(m.error ? String(m.error) : 'That did not go through.');
  return m;
}
async function rpc(name, params){
  const { data, error } = await sb.rpc(name, params || {});

  return data;

  const { data, error } = await sb.from(name).select(sel || '*');

async function loadLoginDirectory(){
  try{
    const ch = await table('club_directory');
    S.clubs = ch.map(mapClub).filter(c => c.hasPresident)
      .sort((a,b) => a.name.localeCompare(b.name));
    if(S.selectedClub){
      const again = S.clubs.find(c => c.id === S.selectedClub.id);
      if(again) S.selectedClub = again;
    }else if(S.clubs.length === 1){
      S.selectedClub = S.clubs[0];
    }else{
      const saved = localStorage.getItem('lbn.club');
      if(saved){ const c = S.clubs.find(x => x.id === saved); if(c) S.selectedClub = c; }
    }
    S.loginDirectory = await table('member_login_directory');
    S.verticals = (await table('verticals','id,name,sort_order')).map(mapVertical);
    S.offline = false;
  }catch(_){
    S.offline = true;
    const c = Cache.load();
    if(c && c.verticals) S.verticals = c.verticals;
  }

    ? usernameOrHandle.trim().toLowerCase()

  const { error } = await sb.auth.signInWithPassword({ email: handle, password });
  if(error){
    throw new AppError(/invalid login/i.test(error.message)
      ? 'Incorrect username or password.' : error.message);
  }
  await restoreSession();
  if(!S.me){
    await sb.auth.signOut();
    throw new AppError('No member profile is linked to this login. Please contact the admin.');
  }
}

async function restoreSession(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ S.me = null; return; }
  await refresh();
  const found = S.members.find(m => m.authUserId === user.id);
  if(!found){ S.me = null; return; }
  if(!isApproved(found)){
    await sb.auth.signOut();
    S.me = null;
    throw new AppError(found.status === 'pending'
      ? 'Your account is still awaiting admin approval.'
      : 'Your account is not active. Please contact the admin.');
  }
  S.me = found;
}

async function refresh(){
  S.loading = true;
  paintChrome();
  try{
    const r = await Promise.all([
      table('members'), table('referrals'), table('l2l_meetings'),
      table('verticals','id,name,sort_order'), table('attendance'), table('meetings'),
      table('leave_requests'), table('thank_you_notes'), table('asks'),
      table('ask_replies'), table('gives')
    ]);
    S.attendance    = r[4].map(mapAttendance);
    S.meetings2     = r[5].map(mapMeeting);
    S.leaveRequests = r[6].map(mapLeave);
    S.thankYouNotes = r[7].map(mapThankYou);
    S.asks          = r[8].map(mapAsk);
    S.askReplies    = r[9].map(mapAskReply);
    S.gives         = r[10].map(mapGive);

    // Office-bearer data: RLS returns nothing rather than failing for members.
    try{
      S.visitors = (await table('visitors')).map(mapVisitor)
        .sort((a,b) => b.createdAt.localeCompare(a.createdAt));
    }catch(_){ S.visitors = []; }
    await loadMinutes();

    await loadSubscription();
    await loadAccess();
    await loadMegaDirectory();

    S.members   = r[0].map(mapMember);
    S.referrals = r[1].map(mapReferral);
    S.meetings  = r[2].map(mapL2l);
    S.verticals = r[3].map(mapVertical);

    if(canViewAccounts()){
      try{
        S.accountTerms = (await table('account_terms')).map(mapTerm);
        S.ledger = (await table('finance_entries')).map(mapFinance)
          .sort((a,b) => b.entryDate.localeCompare(a.entryDate));
        await loadBalances();
      }catch(_){ S.accountTerms = []; S.ledger = []; }
    }

    if(S.me){ const u = memberById(S.me.id); if(u) S.me = u; }
    S.offline = false;
    S.syncedAt = new Date();
    Cache.save();
  }catch(_){
    const c = Cache.load();
    if(c){
      S.members = c.members || S.members;
      S.referrals = c.referrals || S.referrals;
      S.meetings = c.meetings || S.meetings;
      S.verticals = c.verticals || S.verticals;
      S.thankYouNotes = c.thankYouNotes || S.thankYouNotes;
      S.asks = c.asks || S.asks;
      S.askReplies = c.askReplies || S.askReplies;
      S.gives = c.gives || S.gives;
      S.attendance = c.attendance || S.attendance;
      S.syncedAt = c.at ? new Date(c.at) : null;
    }
    S.offline = true;
  }finally{
    S.loading = false;
  }
}

  const s = size || 44;
  const style = 'width:'+s+'px;height:'+s+'px;font-size:'+(s*0.36).toFixed(1)+'px';
  if(m && m.photoUrl && m.photoUrl.indexOf('data:image') === 0){
    return '<div class="avatar" style="'+style+'"><img src="'+esc(m.photoUrl)+'" alt=""></div>';
  }
  return '<div class="avatar" style="'+style+'">'+esc(initials(m ? m.name : '')) +'</div>';
}
function statusTagHTML(status){
  return '<span class="tag '+STATUS_CLASS[status]+'">'+STATUS_LABEL[status]+'</span>';
}
function memberStatusTagHTML(st){
  if(st === 'approved') return '<span class="tag green">Approved</span>';
  if(st === 'pending')  return '<span class="tag gold">Pending</span>';
  return '<span class="tag red">'+esc(st.charAt(0).toUpperCase()+st.slice(1))+'</span>';

  if(!inp) return;
  const box = inp.closest('[data-picker]');
  $('[data-picker-value]', box).value = '';
  $('.chosen', box).hidden = true;
  renderPickerList(box);
});

  const inp = e.target.closest('[data-picker-input]');
  if(inp) renderPickerList(inp.closest('[data-picker]'));

      esc(due ? (att.consecutiveAbsences >= 3
            ? 'You have missed '+att.consecutiveAbsences+' meetings in a row.'
            : 'You have taken '+att.absent+' leaves this term.')
          : (att.consecutiveAbsences === 2
            ? 'You have missed the last 2 meetings.'
            : 'You have used '+att.absent+' of your 6 leaves this term.'))+
      '</p></div></div>';
  }
  if(isAdmin() && pending.length){
    h += '<div class="banner warn"><span class="mi s20">how_to_reg</span><div style="flex:1">'+
      '<p style="margin:0">'+pending.length+' registration'+(pending.length===1?'':'s')+
      ' waiting for your approval.</p></div></div>';
  }

  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">'+
    '<span class="label" style="flex:1">My Business</span>'+
    '<button class="chip" data-act="dash-term"><span class="mi s14">event_note</span>'+
    esc(term == null ? 'All time' : termLabelOf(term))+
    '<span class="mi s18">arrow_drop_down</span></button></div>';

  h += '<div class="tiles">'+
    tileHTML({label:'Referrals Given', value:String(s.given),
      sub:s.convertedAsGiver+' converted', opens:'Referrals'})+
    tileHTML({label:'Referrals Received', value:String(s.received),
      sub:s.pendingReceived > 0 ? s.pendingReceived+' to reply' : 'all replied',
      accent:'gold', urgent:s.pendingReceived > 0, opens:'Referrals'})+
    tileHTML({label:'Business Taken', value:Money.compact(s.businessTaken),
      sub:'from your referrals', accent:'green', opens:'Referrals'})+
    tileHTML({label:'L2L Meetings', value:String(s.l2lCount), sub:'one-to-ones', opens:'L2L'})+
    tileHTML({label:'My Attendance', value:att.present+' present',
      sub: att.absent === 0 ? 'no leave this term — well done'
        : att.absent+' '+plural(att.absent,'leave')+' this term',
      accent: att.feeDue ? 'red' : att.atRisk ? 'gold' : 'green',
      span:true, opens:'My Attendance'})+
    '</div><div style="height:18px"></div>';

  if(celebrations.length){
    h += sectionHTML('Coming Up',
      celebrations.slice(0,4).map(c => celebrationRowHTML(c)).join(''),
      {flush:true, hint:String(celebrations.length)});
  }

  if(isAdmin()){
    const converted = S.referrals.filter(r => r.status === 'converted');
    const total = converted.reduce((t,r) => t + r.convertedValue, 0);
    const awaiting = S.referrals.filter(r => r.status === 'pending').length;
    const rate = S.referrals.length ? Math.round(converted.length*100/S.referrals.length) : 0;
    h += '<div style="height:8px"></div><div class="label">The Club</div><div style="height:9px"></div>'+
      '<div class="tiles">'+
      tileHTML({label:'Members', value:String(activeMembers().length), sub:pending.length+' pending'})+
      tileHTML({label:'Total Referrals', value:String(S.referrals.length), sub:awaiting+' awaiting reply'})+
      tileHTML({label:'Business Converted', value:Money.compact(total),
        sub:converted.length+' converted', accent:'green'})+
      tileHTML({label:'Conversion Rate', value:rate+'%', sub:'of all referrals', accent:'gold'})+
      '</div><div style="height:18px"></div>';

    const ranked = activeMembers().map(m => ({member:m, stats:statsFor(m.id)}))
      .filter(e => e.stats.given > 0)
      .sort((a,b) => b.stats.given - a.stats.given || b.stats.businessGiven - a.stats.businessGiven);
    h += sectionHTML('Top Referral Contributors',
      ranked.length ? ranked.slice(0,5).map((e,i) =>
        '<div class="row" style="cursor:default">'+
        '<span style="width:20px;font-size:14px;font-weight:800;color:'+
          (i<3?'var(--gold-deep)':'var(--muted)')+'">'+(i+1)+'</span>'+
        avatarHTML(e.member,36)+
        '<span class="col"><span class="nm">'+esc(e.member.name)+'</span>'+
        '<span class="sb">'+esc(e.member.company)+'</span></span>'+
        '<span style="text-align:right;flex:none"><b style="font-size:13px;color:var(--blue)">'+
        e.stats.given+' given</b><br><span style="font-size:11.5px;color:var(--green)">'+
        Money.compact(e.stats.businessGiven)+'</span></span></div>').join('')
      : emptyHTML('emoji_events','No referrals given yet'), {flush:true});
  }

  h += sectionHTML('My Recent Referrals',
    recent.length ? recent.slice(0,5).map(r => activityRowHTML(r)).join('')
      : emptyHTML('inbox','No referral activity yet','Tap Add to give a referral to a fellow member.'),
    {flush:true});

  return h + '</div>';
}

/* ---------------------------- Referrals ---------------------------- */
function viewReferrals(){
  const me = S.me, s = statsFor(me.id);
  const i = tabIndex('referrals');
  const tabs = [
    {label:'Received', badge:s.pendingReceived || 0},
    {label:'Given'},
    {label:'Thank You', badge:(s.thankYouGiven + s.thankYouReceived) || 0, badgeClass:'green'},
    {label:'Give New'}
  ];
  let body = '';
  if(i === 0){
    const list = referralsReceivedBy(me.id);
    body = list.length ? '<div class="page">'+list.map(r => referralCardHTML(r,true)).join('')+'</div>'
      : emptyHTML('south_west','No referrals received yet',
        'When a member refers business to you it will appear here.');
  }else if(i === 1){
    const list = referralsGivenBy(me.id);
    body = list.length ? '<div class="page">'+list.map(r => referralCardHTML(r,false)).join('')+'</div>'

/* ---------------------------- Celebrations ---------------------------- */
function buildCelebrations(birthdays){
  const out = [];
  approvedMembers().forEach(m => {
    const source = birthdays ? m.birthday : m.anniversary;
    const next = Dates.nextOccurrence(source);
    if(!next) return;
    const startYear = parseInt(String(source).slice(0,4), 10);
    const years = (startYear && startYear > 1900) ? next.date.getFullYear() - startYear : null;
    out.push({member:m, date:next.date, days:next.days, years:years, birthday:birthdays});
  });
  return out.sort((a,b) => a.days - b.days);
}
function viewCelebrations(){
  const i = tabIndex('celeb');
  const win = S.tabState.celebWindow == null ? 90 : S.tabState.celebWindow;
  const birthdays = buildCelebrations(true), anniversaries = buildCelebrations(false);
  const all = i === 0 ? birthdays : anniversaries;
  const thisMonth = new Date().getMonth();
  const monthCount = all.filter(c => c.date.getMonth() === thisMonth && c.days <= 45).length;
  const today = birthdays.concat(anniversaries).filter(c => c.days === 0);
  const WINDOWS = [{value:'30',label:'Next 30 days'},{value:'60',label:'Next 60 days'},
    {value:'90',label:'Next 90 days'},{value:'180',label:'Next 6 months'},{value:'0',label:'Full year'}];
  const winLabel = (WINDOWS.find(w => +w.value === win) || WINDOWS[2]).label;

  let h = '<div style="background:#fff;padding:12px 14px 0">'+
    '<div style="display:flex;align-items:center;gap:10px;padding-bottom:10px">'+
    '<span class="mi s18" style="color:var(--muted)">filter_list</span>'+
    '<b style="font-size:13px">Show</b>'+
    '<button class="chip" style="margin-left:auto" data-act="celeb-window">'+esc(winLabel)+
    '<span class="mi s18">arrow_drop_down</span></button></div></div>';
  h += tabsHTML('celeb', [
    {label:'Birthdays ('+birthdays.length+')'},
    {label:'Anniversaries ('+anniversaries.length+')'}
  ], i);
  if(today.length){
    h += '<div style="background:var(--gold);color:var(--gold-ink);padding:10px 16px;font-size:12.5px;'+
      'font-weight:700">🎉 '+today.length+' '+plural(today.length,'celebration')+' today — '+
      esc(today.map(c => c.member.name).join(', '))+'</div>';
  }
  if(!all.length){
    return h + emptyHTML(i===0 ? 'cake' : 'favorite',
      i===0 ? 'No birthdays recorded yet' : 'No marriage dates recorded yet',
      'Members need an approved account with this date filled in.');
  }
  let shown = win === 0 ? all : all.filter(c => c.days <= win);
  let fellBack = false;
  if(!shown.length){ shown = all.slice(0,5); fellBack = true; }

  h += '<div class="page" style="padding-top:12px">';
  h += '<div class="card pad" style="font-size:12.5px;color:var(--muted)">'+monthCount+
    ' this month · '+all.length+' in the year</div>';
  if(fellBack){
    h += '<div class="banner warn"><p style="margin:0">None in the next '+win+
      ' days. Showing the next few instead.</p></div>';
  }
  h += shown.map(c => celebrationCardHTML(c)).join('');
  return h + '</div>';
}
function celebrationCardHTML(c){
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const isToday = c.days === 0;
  const when = c.days === 0 ? 'Today' : c.days === 1 ? 'Tomorrow' : 'in '+c.days+' days';
  const years = c.years == null ? '' :
    (c.birthday ? ' · Turning '+c.years : ' · '+c.years+' years together');
  const msg = c.birthday
    ? 'Dear '+c.member.name+', wishing you a very happy birthday from all of us at '+clubName()+'!'
    : 'Dear '+c.member.name+', wishing you and your family a very happy wedding anniversary from all of us at '+clubName()+'!';

    c.date.getDate()+'</b><span>'+MON[c.date.getMonth()]+'</span></div>'+
    avatarHTML(c.member,40)+

    esc(c.member.name)+'</div>'+
    '<div style="font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;'+
    'text-overflow:ellipsis">'+esc(c.member.company)+'</div>'+
    '<div style="font-size:11.5px;margin-top:3px;'+
    (isToday?'font-weight:700;color:var(--gold-deep)':'color:var(--muted)')+'">'+
    esc(when+years)+'</div></div>'+

    'style="background:none;border:0;padding:8px;color:#25D366;cursor:pointer">'+

function resolveTyped(){
  const q = LoginUI.typed.trim().toLowerCase();
  if(!q) return null;
  const dir = loginDirectoryForClub();
  const exact = dir.filter(m => String(m.name||'').toLowerCase() === q);
  if(exact.length === 1) return String(exact[0].login_handle||'');
  const partial = dir.filter(m =>
    String(m.name||'').toLowerCase().indexOf(q) >= 0 ||
    String(m.company||'').toLowerCase().indexOf(q) >= 0);
  if(partial.length === 1) return String(partial[0].login_handle||'');
  return null;
}
function renderSuggest(){
  const el = $('#nameSuggest');
  if(!el) return;
  const q = LoginUI.typed.trim().toLowerCase();
  let list = loginDirectoryForClub().slice()
    .sort((a,b) => String(a.name||'').toLowerCase().localeCompare(String(b.name||'').toLowerCase()));
  if(q) list = list.filter(m =>
    String(m.name||'').toLowerCase().indexOf(q) >= 0 ||
    String(m.company||'').toLowerCase().indexOf(q) >= 0);
  if(!list.length){ el.hidden = true; return; }

async function doLogin(){
  if(LoginUI.busy) return;
  const handle = LoginUI.handle || resolveTyped();
  const pw = $('#pwInput') ? $('#pwInput').value : '';
  if(!handle){
    bad(LoginUI.typed.trim()
      ? 'More than one member matches that. Pick the right one from the list.'
      : 'Type your name, then pick it from the list.');
    return;
  }
  if(!pw){ bad('Please enter your password.'); return; }
  LoginUI.busy = true;
  const btn = $('#loginBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner sm white"></span>'; }
  try{
    await signIn(handle, pw);
    LoginUI.busy = false;
    render();
  }catch(e){
    LoginUI.busy = false;
    bad(e instanceof AppError ? e.message : 'Could not sign in. Check your connection.');
    if(btn){ btn.disabled = false; btn.textContent = 'Login as Member'; }
  }
}

/* keeps a busy button honest while an await runs */
async function busy(el, fn){
  if(!el || el.dataset.busy) return;
  const old = el.innerHTML;
  el.dataset.busy = '1';
  el.disabled = true;
  el.innerHTML = '<span class="spinner sm white"></span>';
  try{ await fn(); }
  finally{
    delete el.dataset.busy;
    el.disabled = false;
    el.innerHTML = old;
  }
}
function reportError(e){
  bad(e instanceof AppError ? e.message : 'Could not save. Check your connection.');
}

    const desc = $('#refDesc').value.trim();

    const pw2     = $('#regPw2').value;

    if(!name){ bad('Enter your full name.'); return; }
    if(!/^[0-9+\-\s()]{10,15}$/.test(phone)){ bad('Enter a valid mobile number.'); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){
      bad('Enter a valid email address — attendance reminders are sent there.'); return; }
    if(!company){ bad('Enter your company or firm name.'); return; }

          p_blood_group: blood || null, p_birthday: dob, p_anniversary: doa || null,

/* ==========================================================================
   Wiring
   ========================================================================== */
document.addEventListener('click', async e => {
  /* sheet + drawer dismissal */
  if(e.target.closest('[data-close]')){ closeSheet(); return; }
  if(e.target.id === 'scrim'){ closeDrawer(); return; }
  if(e.target.closest('#lightbox')){ $('#lightbox').classList.remove('on'); return; }

  /* login name suggestion */
  const sug = e.target.closest('[data-handle]');
  if(sug){
    LoginUI.handle = sug.dataset.handle;
    LoginUI.typed = sug.dataset.name;
    $('#nameInput').value = sug.dataset.name;
    $('#nameSuggest').hidden = true;
    const help = $('#login .help');
    if(help){ help.classList.add('ok'); help.textContent = 'Name selected. Enter your password below.'; }
    const pw = $('#pwInput'); if(pw) pw.focus();
    return;
  }

  /* radio groups inside forms */
  const radio = e.target.closest('[data-radio]');
  if(radio){
    const group = radio.dataset.radio;
    $$('[data-radio="'+group+'"]').forEach(r => r.classList.toggle('on', r === radio));
    if(group === 'outcome'){
      $('#replyOutcome').value = radio.dataset.value;
      $('#valueWrap').hidden = radio.dataset.value !== 'converted';
    }
    return;
  }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = ACTIONS[el.dataset.act];
  if(!fn) return;
  e.preventDefault();
  try{ await fn(el, el.dataset); }
  catch(err){ console.error(err); reportError(err); }
});

/* pull to refresh */
(function(){
  const main = $('#main');
  let startY = 0, pulling = false;
  main.addEventListener('touchstart', e => {
    if(main.scrollTop <= 0 && e.touches.length === 1){ startY = e.touches[0].clientY; pulling = true; }
  }, {passive:true});
  main.addEventListener('touchmove', e => {
    if(!pulling) return;
    if(e.touches[0].clientY - startY > 90){
      pulling = false;
      if(!S.loading && signedIn()){
        paintChrome();
        refresh().then(() => render());
      }
    }
  }, {passive:true});
  main.addEventListener('touchend', () => { pulling = false; }, {passive:true});
})();

/* back button closes what is open before leaving */
history.replaceState({lbn:1}, '');
window.addEventListener('popstate', () => {
  history.pushState({lbn:1}, '');
  if(sheetOpen()){ closeSheet(); return; }
  if($('#drawer').classList.contains('on')){ closeDrawer(); return; }
  if(!signedIn() && AuthUI.screen !== 'login'){
    AuthUI.screen = 'login'; renderLogin(); $('#login').scrollTop = 0; return;
  }
  if(signedIn() && S.tab !== 'Dashboard'){ go('Dashboard'); }
});
history.pushState({lbn:1}, '');

/* stay fresh when the app comes back to the foreground */
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'visible' && signedIn() && !S.loading){
    const age = S.syncedAt ? Date.now() - S.syncedAt.getTime() : Infinity;
    if(age > 120000){ await refresh(); render(); }
  }
});
window.addEventListener('online',  async () => {
  if(signedIn()){ await refresh(); render(); return; }
  await loadLoginDirectory();
  /* never repaint a part-filled registration form under the member */
  if(AuthUI.screen === 'login') renderLogin();
});
window.addEventListener('offline', () => {
  S.offline = true;
  if(signedIn() || AuthUI.screen === 'login') render();
});

/* installable on Android; iOS uses Add to Home Screen */
(function(){
  const manifest = {
    name: CFG.appName, short_name: 'LBN', start_url: '.', scope: '.',
    display: 'standalone', orientation: 'portrait',
    background_color: '#F5F7FB', theme_color: '#142B52',
    description: CFG.tagline,
    icons: [
      {src: ICON, sizes:'192x192', type:'image/png', purpose:'any'},
      {src: ICON, sizes:'192x192', type:'image/png', purpose:'maskable'}
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

/* If the icon font never arrives, hide the ligature text rather than
   printing "menu" and "refresh" all over the screen. */
(function(){
  const mark = () => {
    try{
      if(!document.fonts.check('24px "Material Symbols Outlined"')) document.body.classList.add('nofont');
      else document.body.classList.remove('nofont');
    }catch(_){}
  };
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(mark);
    setTimeout(mark, 3500);
  }
})();

/* ==========================================================================
   Boot
   ========================================================================== */
(async function boot(){
  try{
    await loadLoginDirectory();
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      try{ await restoreSession(); }
      catch(e){ if(e instanceof AppError) setTimeout(() => bad(e.message), 400); }
    }
  }catch(_){ /* a failed restore just means we show the login screen */ }
  render();
})();
